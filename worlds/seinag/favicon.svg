<!--
  Seinag's mark: SeiOU's arch, with solar panels on its blocks and the sun
  rising behind it, under Seiza's twilight-into-starfield gradient, so the
  worlds read as one family in a row of tabs. build.mjs copies this over
  dist/favicon.svg in Seinag's build only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Seinag">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c26"/>
      <stop offset="42%" stop-color="#1b1546"/>
      <stop offset="72%" stop-color="#4b2a66"/>
      <stop offset="92%" stop-color="#a85570"/>
      <stop offset="100%" stop-color="#e8823f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- The sun, and its rays: sinag. -->
    <circle cx="32" cy="22" r="8" fill="#ffcf6e"/>
    <g stroke="#ffcf6e" stroke-width="2.2" stroke-linecap="round">
      <line x1="32" y1="6" x2="32" y2="10"/>
      <line x1="20" y1="11" x2="22.5" y2="13.5"/>
      <line x1="44" y1="11" x2="41.5" y2="13.5"/>
      <line x1="15" y1="22" x2="19" y2="22"/>
      <line x1="45" y1="22" x2="49" y2="22"/>
    </g>
    <!-- The building, panels on both blocks. -->
    <rect x="6" y="32" width="15" height="22" fill="#d8c98a"/>
    <rect x="43" y="32" width="15" height="22" fill="#d8c98a"/>
    <g fill="#1b2b4f" stroke="#7fa7ff" stroke-width="0.5">
      <path d="M6 32 L21 32 L19 28 L8 28 Z"/>
      <path d="M43 32 L58 32 L56 28 L45 28 Z"/>
    </g>
    <path d="M19 36 Q32 27 45 36 L45 42 L19 42 Z" fill="#cdbd7c"/>
    <rect x="21" y="42" width="22" height="4" fill="#1d3b2c"/>
    <g fill="#1d3b2c">
      <rect x="9" y="37" width="3" height="17"/>
      <rect x="15" y="37" width="3" height="17"/>
      <rect x="46" y="37" width="3" height="17"/>
      <rect x="52" y="37" width="3" height="17"/>
    </g>
    <rect x="0" y="54" width="64" height="10" fill="#0b0a1c"/>
  </g>
</svg>
