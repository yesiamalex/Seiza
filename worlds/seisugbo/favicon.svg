<!--
  Seisugbo's mark: a string of fiesta bunting over a row of roofs, against
  Seiza's own twilight-into-starfield (the same gradient stops as
  public/favicon.svg), so the worlds read as one family in a row of tabs.
  build.mjs copies this over dist/favicon.svg in Seisugbo's build only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Seisugbo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c26"/>
      <stop offset="42%" stop-color="#1b1546"/>
      <stop offset="72%" stop-color="#4b2a66"/>
      <stop offset="92%" stop-color="#a85570"/>
      <stop offset="100%" stop-color="#e8823f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <g fill="#ffffff">
      <circle cx="9" cy="8" r="0.9" opacity="0.95"/>
      <circle cx="21" cy="5" r="0.6" opacity="0.7"/>
      <circle cx="50" cy="7" r="0.8" opacity="0.9"/>
      <circle cx="58" cy="15" r="0.5" opacity="0.6"/>
      <circle cx="37" cy="4" r="0.5" opacity="0.6"/>
    </g>
    <!-- The bunting: a sagging string with five flags. -->
    <path d="M4 16 Q32 30 60 16" fill="none" stroke="#f4f1ea" stroke-width="1.4"/>
    <path d="M9 18.6 L15 21 L11.2 27.5 Z" fill="#e2392f"/>
    <path d="M19.5 22.2 L25.5 23.4 L22 30.2 Z" fill="#f6c624"/>
    <path d="M29.5 23.6 L35.5 23.6 L32.5 30.8 Z" fill="#2f6fd0"/>
    <path d="M38.5 23.4 L44.5 22.2 L42 30.2 Z" fill="#2fa35a"/>
    <path d="M49 21 L55 18.6 L52.8 27.5 Z" fill="#ef6fa8"/>
    <!-- Roofs, close together, and a lit window. -->
    <path d="M0 64 V46 L10 41 L20 46 V44 L31 38 L42 44 V42 L52 37 L64 43 V64 Z" fill="#0b0a1c"/>
    <rect x="27.5" y="48" width="6" height="5" rx="0.6" fill="#ffc874"/>
    <rect x="47" y="47" width="5" height="4.5" rx="0.6" fill="#ffc874" opacity="0.85"/>
  </g>
</svg>
